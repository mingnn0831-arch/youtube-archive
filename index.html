<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>유튜브 아카이브</title>
  <meta name="description" content="유튜브 영상을 Notion에 빠르게 아카이빙" />
  <meta name="theme-color" content="#CC0000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="YT Archive" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red: #CC0000;
      --red-bright: #FF0000;
      --red-dark: #8B0000;
      --red-glow: rgba(204, 0, 0, 0.35);
      --bg: #0A0A0A;
      --bg2: #111111;
      --bg3: #1A1A1A;
      --surface: #1E1E1E;
      --surface2: #252525;
      --border: rgba(255,255,255,0.07);
      --border-red: rgba(204,0,0,0.4);
      --text: #F0F0F0;
      --text-muted: #888;
      --text-dim: #555;
      --success: #22C55E;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { background: var(--bg); }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 22px;
      background: var(--red);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px var(--red-glow);
    }

    .logo-icon svg { width: 14px; height: 14px; fill: white; }

    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--text);
      line-height: 1;
    }

    .logo-text span { color: var(--red); }

    .header-notion-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .header-notion-link:hover { color: var(--text); border-color: var(--border-red); }
    .header-notion-link svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── MAIN ── */
    main {
      padding: 20px 16px 120px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── THUMBNAIL PREVIEW ── */
    .preview-area {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .preview-area.has-thumb { border-color: var(--border-red); }

    .preview-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
    }

    .preview-placeholder svg { width: 44px; height: 44px; fill: var(--text-dim); opacity: 0.5; }
    .preview-placeholder span { font-size: 13px; font-weight: 300; }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .preview-img.visible { display: block; }

    .preview-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
      display: none;
    }
    .preview-img.visible ~ .preview-overlay { display: block; }

    .preview-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 38px;
      background: var(--red);
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--red-glow);
    }
    .preview-img.visible ~ .preview-play-btn { display: flex; }
    .preview-play-btn svg { width: 18px; height: 18px; fill: white; }

    /* ── FORM SECTIONS ── */
    .section {
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 15px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]::placeholder,
    input[type="url"]::placeholder { color: var(--text-dim); font-size: 14px; }

    input[type="text"]:focus,
    input[type="url"]:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-glow);
    }

    /* URL 클리어 버튼 */
    .input-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      background: var(--surface2);
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .input-clear.visible { display: flex; }

    /* ── YOUTUBER SELECT ── */
    .youtuber-wrap {
      position: relative;
    }

    .youtuber-select-btn {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 15px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text-dim);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    .youtuber-select-btn.selected { color: var(--text); }
    .youtuber-select-btn:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-glow); outline: none; }

    .youtuber-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--bg3);
      border: 1px solid var(--border-red);
      border-radius: var(--radius);
      z-index: 50;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .youtuber-dropdown.open { display: block; }

    .dropdown-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .dropdown-search input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      outline: none;
    }

    .dropdown-list { padding: 4px 0; }

    .dropdown-item {
      padding: 11px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dropdown-item:hover { background: var(--surface); }
    .dropdown-item.direct-input { color: var(--red); }
    .dropdown-item .channel-dot {
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .loading-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

    /* ── STAR RATING ── */
    .star-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .star-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Noto Sans KR', sans-serif;
      flex: 1;
      min-width: 0;
      text-align: center;
      white-space: nowrap;
    }

    .star-btn:hover { border-color: var(--border-red); color: var(--text); }

    .star-btn.active {
      background: rgba(204,0,0,0.15);
      border-color: var(--red);
      color: var(--text);
      box-shadow: 0 0 8px rgba(204,0,0,0.2);
    }

    .star-btn.scheduled {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--text-muted);
      font-size: 12px;
    }
    .star-btn.scheduled.active {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.3);
      color: var(--text);
    }

    /* ── CATEGORY TAGS ── */
    .category-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .cat-chip {
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 400;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    .cat-chip:hover { border-color: var(--border-red); color: var(--text); }
    .cat-chip.active {
      background: rgba(204,0,0,0.15);
      border-color: var(--red);
      color: #FF6666;
    }

    .cat-custom-wrap {
      display: flex;
      gap: 8px;
    }
    .cat-custom-wrap input {
      flex: 1;
      padding: 10px 12px;
      font-size: 13px;
    }
    .cat-add-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .cat-add-btn:hover { border-color: var(--border-red); color: var(--text); }

    /* selected tags */
    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 12px;
      background: rgba(204,0,0,0.15);
      border: 1px solid var(--red);
      border-radius: 20px;
      font-size: 12px;
      color: #FF8888;
    }
    .tag-pill button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      opacity: 0.7;
    }
    .tag-pill button:hover { opacity: 1; }

    /* ── MEMO ── */
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      outline: none;
      resize: none;
      min-height: 80px;
      line-height: 1.6;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    textarea::placeholder { color: var(--text-dim); }
    textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-glow); }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── SAVE BUTTON ── */
    .save-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .save-btn {
      width: 100%;
      background: var(--red);
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 20px rgba(204,0,0,0.4);
    }
    .save-btn:hover { background: var(--red-bright); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(204,0,0,0.5); }
    .save-btn:active { transform: translateY(0); }
    .save-btn:disabled { background: var(--surface2); color: var(--text-dim); box-shadow: none; cursor: not-allowed; transform: none; }
    .save-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--red); color: #FF6666; }
    .toast svg { width: 16px; height: 16px; fill: currentColor; }

    /* ── SPINNER ── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE ── */
    @media (max-width: 360px) {
      .star-btn { padding: 8px 10px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-2.75 12.63 12.63 0 00-6.2 0A4.83 4.83 0 016.41 6.69 17.88 17.88 0 005 12a17.88 17.88 0 001.41 5.31 4.83 4.83 0 003.77 2.75 12.63 12.63 0 006.2 0 4.83 4.83 0 003.77-2.75A17.88 17.88 0 0021 12a17.88 17.88 0 00-1.41-5.31zM10 15.5v-7l6 3.5-6 3.5z"/></svg>
      </div>
      <span class="logo-text">YT <span>ARCHIVE</span></span>
    </div>
    <a href="NOTION_DB_URL" target="_blank" class="header-notion-link" id="notionLink">
      <svg viewBox="0 0 24 24"><path d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952L12.21 19s0 .84-1.168.84l-3.222.186c-.093-.186 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.279v-6.44l-1.215-.139c-.093-.514.28-.887.747-.933zM1.936 1.035l13.31-.98c1.634-.14 2.055-.047 3.082.7l4.249 2.986c.7.513.934.653.934 1.213v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.447-1.632z"/></svg>
      아카이브 보기
    </a>
  </header>

  <!-- MAIN FORM -->
  <main>
    <!-- Thumbnail Preview -->
    <div class="preview-area" id="previewArea">
      <div class="preview-placeholder" id="previewPlaceholder">
        <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-2.75 12.63 12.63 0 00-6.2 0A4.83 4.83 0 016.41 6.69 17.88 17.88 0 005 12a17.88 17.88 0 001.41 5.31 4.83 4.83 0 003.77 2.75 12.63 12.63 0 006.2 0 4.83 4.83 0 003.77-2.75A17.88 17.88 0 0021 12a17.88 17.88 0 00-1.41-5.31zM10 15.5v-7l6 3.5-6 3.5z"/></svg>
        <span>유튜브 링크를 입력하면 썸네일이 표시됩니다</span>
      </div>
      <img class="preview-img" id="previewImg" src="" alt="썸네일" />
      <div class="preview-overlay"></div>
      <div class="preview-play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <!-- YouTube URL -->
    <div class="section">
      <div class="section-label">유튜브 링크 *</div>
      <div class="input-wrap">
        <input type="url" id="ytUrl" placeholder="https://youtu.be/..." autocomplete="off" autocorrect="off" autocapitalize="off" />
        <button class="input-clear" id="urlClear" onclick="clearUrl()">✕</button>
      </div>
    </div>

    <!-- Title -->
    <div class="section">
      <div class="section-label">영상 제목 *</div>
      <input type="text" id="title" placeholder="영상 제목 입력" />
    </div>

    <!-- Youtuber / Channel -->
    <div class="section">
      <div class="section-label">채널 / 유튜버</div>
      <div class="youtuber-wrap">
        <button class="youtuber-select-btn" id="youtuberBtn" onclick="toggleYoutuberDropdown()">
          <span id="youtuberLabel">채널 선택 또는 직접 입력</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="youtuber-dropdown" id="youtuberDropdown">
          <div class="dropdown-search">
            <input type="text" id="youtuberSearch" placeholder="채널 검색..." oninput="filterYoutubers(this.value)" />
          </div>
          <div class="dropdown-list" id="youtuberList">
            <div class="dropdown-item" style="color:var(--text-dim)">
              <span class="loading-dot"></span> 불러오는 중...
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Star Rating -->
    <div class="section">
      <div class="section-label">별점</div>
      <div class="star-group" id="starGroup">
        <button class="star-btn scheduled active" data-val="예정" onclick="selectStar(this)">예정</button>
        <button class="star-btn" data-val="⭐" onclick="selectStar(this)">⭐</button>
        <button class="star-btn" data-val="⭐⭐" onclick="selectStar(this)">⭐⭐</button>
        <button class="star-btn" data-val="⭐⭐⭐" onclick="selectStar(this)">⭐⭐⭐</button>
        <button class="star-btn" data-val="⭐⭐⭐⭐" onclick="selectStar(this)">⭐⭐⭐⭐</button>
        <button class="star-btn" data-val="⭐⭐⭐⭐⭐" onclick="selectStar(this)">⭐⭐⭐⭐⭐</button>
      </div>
    </div>

    <!-- Category -->
    <div class="section">
      <div class="section-label">카테고리</div>
      <div class="category-grid" id="catGrid">
        <button class="cat-chip" data-cat="디자인/크리에이티브" onclick="toggleCat(this)">디자인/크리에이티브</button>
        <button class="cat-chip" data-cat="경제/재테크" onclick="toggleCat(this)">경제/재테크</button>
        <button class="cat-chip" data-cat="이슈/시사" onclick="toggleCat(this)">이슈/시사</button>
        <button class="cat-chip" data-cat="테크/IT" onclick="toggleCat(this)">테크/IT</button>
        <button class="cat-chip" data-cat="자기계발" onclick="toggleCat(this)">자기계발</button>
        <button class="cat-chip" data-cat="엔터/예능" onclick="toggleCat(this)">엔터/예능</button>
        <button class="cat-chip" data-cat="교육/강의" onclick="toggleCat(this)">교육/강의</button>
        <button class="cat-chip" data-cat="여행/라이프" onclick="toggleCat(this)">여행/라이프</button>
      </div>
      <div class="cat-custom-wrap">
        <input type="text" id="catCustom" placeholder="직접 입력 후 추가" onkeydown="if(event.key==='Enter'){addCustomCat();event.preventDefault();}" />
        <button class="cat-add-btn" onclick="addCustomCat()">+ 추가</button>
      </div>
      <div class="selected-tags" id="selectedTags"></div>
    </div>

    <!-- Memo -->
    <div class="section">
      <div class="section-label">한줄평</div>
      <textarea id="memo" placeholder="간단한 메모를 남겨보세요..." rows="3"></textarea>
    </div>
  </main>

  <!-- SAVE BAR -->
  <div class="save-bar">
    <button class="save-btn" id="saveBtn" onclick="save()">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>
      Notion에 저장
    </button>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ─── CONFIG ───────────────────────────────────────
    // Cloudflare Workers URL을 여기에 입력하세요
    const WORKER_URL = 'https://youtube-archive.wogns3885.workers.dev';
    // Notion 아카이브 DB 페이지 URL
    const NOTION_DB_URL = 'https://www.notion.so/32f0fe84d333809abce2d12c6c14197f';

    // ─── STATE ────────────────────────────────────────
    let selectedYoutuber = '';
    let selectedStar = '예정';
    let selectedCats = new Set();
    let youtubers = [];
    let thumbUrl = '';

    // ─── INIT ─────────────────────────────────────────
    document.getElementById('notionLink').href = NOTION_DB_URL;

    document.addEventListener('DOMContentLoaded', () => {
      loadYoutubers();
      document.getElementById('ytUrl').addEventListener('input', onUrlInput);
      // 외부 클릭 시 드롭다운 닫기
      document.addEventListener('click', (e) => {
        const wrap = document.querySelector('.youtuber-wrap');
        if (!wrap.contains(e.target)) closeYoutuberDropdown();
      });
    });

    // ─── URL INPUT & THUMBNAIL ────────────────────────
    let urlTimer = null;
    function onUrlInput(e) {
      const val = e.target.value.trim();
      document.getElementById('urlClear').classList.toggle('visible', val.length > 0);
      clearTimeout(urlTimer);
      if (!val) { clearThumb(); return; }
      urlTimer = setTimeout(() => loadThumb(val), 600);
    }

    function clearUrl() {
      document.getElementById('ytUrl').value = '';
      document.getElementById('urlClear').classList.remove('visible');
      clearThumb();
    }

    function extractVideoId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
        /^([A-Za-z0-9_-]{11})$/
      ];
      for (const p of patterns) {
        const m = url.match(p);
        if (m) return m[1];
      }
      return null;
    }

    function loadThumb(url) {
      const vid = extractVideoId(url);
      if (!vid) { clearThumb(); return; }
      thumbUrl = `https://img.youtube.com/vi/${vid}/maxresdefault.jpg`;
      const img = document.getElementById('previewImg');
      img.onload = () => {
        img.classList.add('visible');
        document.getElementById('previewPlaceholder').style.display = 'none';
        document.getElementById('previewArea').classList.add('has-thumb');
      };
      img.onerror = () => {
        thumbUrl = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
        img.src = thumbUrl;
      };
      img.src = thumbUrl;

      // 제목 자동완성
      fetchTitle(url);
    }

    async function fetchTitle(url) {
      const titleInput = document.getElementById('title');
      // 이미 직접 입력한 내용이 있으면 덮어쓰지 않음
      if (titleInput.value.trim()) return;

      titleInput.placeholder = '제목 불러오는 중...';
      try {
        const res = await fetch(`${WORKER_URL}/title?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data.title && !titleInput.value.trim()) {
          titleInput.value = data.title;
          // 채널명도 비어있으면 자동완성
          if (data.author_name && !selectedYoutuber) {
            const directInput = document.getElementById('youtuberDirect');
            if (directInput) {
              directInput.value = data.author_name;
              selectedYoutuber = data.author_name;
            } else if (!document.getElementById('youtuberBtn').classList.contains('selected')) {
              document.getElementById('youtuberLabel').textContent = data.author_name;
              document.getElementById('youtuberBtn').classList.add('selected');
              selectedYoutuber = data.author_name;
            }
          }
        }
      } catch {
        // 실패해도 조용히 무시
      } finally {
        titleInput.placeholder = '영상 제목 입력';
      }
    }

    function clearThumb() {
      thumbUrl = '';
      const img = document.getElementById('previewImg');
      img.classList.remove('visible');
      img.src = '';
      document.getElementById('previewPlaceholder').style.display = '';
      document.getElementById('previewArea').classList.remove('has-thumb');
    }

    // ─── YOUTUBERS ────────────────────────────────────
    async function loadYoutubers() {
      try {
        const res = await fetch(`${WORKER_URL}/youtubers`);
        const data = await res.json();
        youtubers = data.youtubers || [];
        renderYoutuberList(youtubers);
      } catch {
        document.getElementById('youtuberList').innerHTML =
          '<div class="dropdown-item" style="color:var(--text-dim);font-size:13px">불러오기 실패</div>';
      }
    }

    function renderYoutuberList(list) {
      const el = document.getElementById('youtuberList');
      const searchVal = document.getElementById('youtuberSearch').value;
      let html = '<div class="dropdown-item direct-input" onclick="selectDirectInput()">✏️ 직접 입력</div>';
      if (list.length === 0 && !searchVal) {
        html += '<div class="dropdown-item" style="color:var(--text-dim);font-size:13px">등록된 채널 없음</div>';
      } else {
        list.forEach(y => {
          html += `<div class="dropdown-item" onclick="selectYoutuber('${y.replace(/'/g,"\\'")}')">
            <span class="channel-dot"></span>${y}
          </div>`;
        });
        if (searchVal && !list.includes(searchVal)) {
          html += `<div class="dropdown-item direct-input" onclick="selectYoutuber('${searchVal.replace(/'/g,"\\'")}')">
            + "${searchVal}" 추가
          </div>`;
        }
      }
      el.innerHTML = html;
    }

    function filterYoutubers(q) {
      const filtered = q ? youtubers.filter(y => y.includes(q)) : youtubers;
      renderYoutuberList(filtered);
    }

    function toggleYoutuberDropdown() {
      const dd = document.getElementById('youtuberDropdown');
      dd.classList.toggle('open');
      if (dd.classList.contains('open')) {
        setTimeout(() => document.getElementById('youtuberSearch').focus(), 50);
      }
    }

    function closeYoutuberDropdown() {
      document.getElementById('youtuberDropdown').classList.remove('open');
    }

    function selectYoutuber(name) {
      selectedYoutuber = name;
      const btn = document.getElementById('youtuberBtn');
      document.getElementById('youtuberLabel').textContent = name;
      btn.classList.add('selected');
      closeYoutuberDropdown();
    }

    function selectDirectInput() {
      const val = document.getElementById('youtuberSearch').value.trim();
      if (val) { selectYoutuber(val); return; }
      closeYoutuberDropdown();
      const btn = document.getElementById('youtuberBtn');
      document.getElementById('youtuberLabel').textContent = '직접 입력...';
      // 드롭다운 대신 인라인 input으로 전환
      const wrap = document.querySelector('.youtuber-wrap');
      wrap.innerHTML = `<input type="text" id="youtuberDirect" placeholder="채널명 직접 입력" style="width:100%;background:var(--surface);border:1px solid var(--red);border-radius:var(--radius);padding:13px 14px;font-size:15px;font-family:'Noto Sans KR',sans-serif;color:var(--text);outline:none;" oninput="selectedYoutuber=this.value" />`;
    }

    // ─── STAR ─────────────────────────────────────────
    function selectStar(el) {
      document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      selectedStar = el.dataset.val;
    }

    // ─── CATEGORY ─────────────────────────────────────
    function toggleCat(el) {
      const cat = el.dataset.cat;
      if (selectedCats.has(cat)) {
        selectedCats.delete(cat);
        el.classList.remove('active');
      } else {
        selectedCats.add(cat);
        el.classList.add('active');
      }
      renderSelectedTags();
    }

    function addCustomCat() {
      const input = document.getElementById('catCustom');
      const val = input.value.trim();
      if (!val || selectedCats.has(val)) { input.value = ''; return; }
      selectedCats.add(val);
      input.value = '';
      renderSelectedTags();
    }

    function removeTag(cat) {
      selectedCats.delete(cat);
      // 프리셋 버튼 해제
      document.querySelectorAll('.cat-chip').forEach(b => {
        if (b.dataset.cat === cat) b.classList.remove('active');
      });
      renderSelectedTags();
    }

    function renderSelectedTags() {
      const wrap = document.getElementById('selectedTags');
      wrap.innerHTML = '';
      selectedCats.forEach(cat => {
        const pill = document.createElement('div');
        pill.className = 'tag-pill';
        pill.innerHTML = `${cat}<button onclick="removeTag('${cat.replace(/'/g,"\\'")}')">✕</button>`;
        wrap.appendChild(pill);
      });
    }

    // ─── SAVE ─────────────────────────────────────────
    async function save() {
      const url = document.getElementById('ytUrl').value.trim();
      const title = document.getElementById('title').value.trim();
      const memo = document.getElementById('memo').value.trim();

      if (!url) { showToast('유튜브 링크를 입력해주세요', 'error'); return; }
      if (!title) { showToast('영상 제목을 입력해주세요', 'error'); return; }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> 저장 중...';

      const youtuberVal = selectedYoutuber ||
        (document.getElementById('youtuberDirect') ? document.getElementById('youtuberDirect').value.trim() : '');

      const payload = {
        title,
        url,
        youtuber: youtuberVal,
        star: selectedStar,
        categories: [...selectedCats],
        memo,
        thumbnail: thumbUrl
      };

      try {
        const res = await fetch(`${WORKER_URL}/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(await res.text());

        showToast('저장 완료! Notion에 추가되었습니다 ✓', 'success');
        resetForm();
        loadYoutubers(); // 새 채널 추가 시 목록 새로고침
      } catch (err) {
        console.error(err);
        showToast('저장 실패: ' + (err.message || '서버 오류'), 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2zM17 21v-8H7v8M7 3v5h8"/></svg> Notion에 저장`;
      }
    }

    function resetForm() {
      document.getElementById('ytUrl').value = '';
      document.getElementById('title').value = '';
      document.getElementById('memo').value = '';
      document.getElementById('urlClear').classList.remove('visible');
      clearThumb();
      selectedYoutuber = '';
      selectedStar = '예정';
      selectedCats.clear();
      document.getElementById('youtuberLabel').textContent = '채널 선택 또는 직접 입력';
      document.getElementById('youtuberBtn') && document.getElementById('youtuberBtn').classList.remove('selected');
      document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.star-btn.scheduled').classList.add('active');
      document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
      document.getElementById('selectedTags').innerHTML = '';
    }

    // ─── TOAST ────────────────────────────────────────
    let toastTimer;
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      clearTimeout(toastTimer);
      const icon = type === 'success'
        ? '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'
        : type === 'error'
        ? '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>'
        : '';
      t.innerHTML = icon + msg;
      t.className = `toast ${type}`;
      requestAnimationFrame(() => { requestAnimationFrame(() => t.classList.add('show')); });
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ─── PWA SERVICE WORKER ───────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
