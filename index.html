<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>유튜브 아카이브</title>
  <meta name="description" content="유튜브 영상을 Notion에 빠르게 아카이빙" />
  <meta name="theme-color" content="#CC0000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="YT Archive" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red: #CC0000;
      --red-bright: #E60000;
      --red-dark: #990000;
      --red-glow: rgba(204, 0, 0, 0.15);
      --bg: #F5F5F5;
      --bg2: #EBEBEB;
      --bg3: #FFFFFF;
      --surface: #FFFFFF;
      --surface2: #F0F0F0;
      --border: rgba(0,0,0,0.09);
      --border-red: rgba(204,0,0,0.35);
      --text: #111111;
      --text-muted: #666666;
      --text-dim: #AAAAAA;
      --success: #16A34A;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { background: var(--bg); }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245,245,245,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      padding-top: env(safe-area-inset-top);
      height: calc(56px + env(safe-area-inset-top));
      display: flex;
      align-items: flex-end;
      padding-bottom: 10px;
      justify-content: space-between;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg { width: 34px; height: 24px; }

    .logo-text {
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      line-height: 1;
    }

    .logo-text span { color: var(--text); }

    .header-notion-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: all 0.2s;
    }
    @media (hover: hover) { .header-notion-link:hover { color: var(--red); border-color: var(--border-red); } }
    .header-notion-link svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── MAIN ── */
    main {
      padding: 20px 16px 120px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── THUMBNAIL PREVIEW ── */
    .preview-area {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--surface2);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .preview-area.has-thumb { border-color: var(--border-red); }

    .preview-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
    }

    .preview-placeholder svg { width: 44px; height: 44px; fill: #AAAAAA; }
    .preview-placeholder span { font-size: 13px; font-weight: 400; color: #888888; }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .preview-img.visible { display: block; }

    .preview-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
      display: none;
    }
    .preview-img.visible ~ .preview-overlay { display: block; }

    .preview-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 38px;
      background: var(--red);
      border-radius: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--red-glow);
    }
    .preview-img.visible ~ .preview-play-btn { display: flex; }
    .preview-play-btn svg { width: 18px; height: 18px; fill: white; }

    /* ── FORM SECTIONS ── */
    .section {
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 15px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]::placeholder,
    input[type="url"]::placeholder { color: var(--text-dim); font-size: 14px; }

    input[type="text"]:focus,
    input[type="url"]:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-glow);
    }

    /* URL 클리어 버튼 */
    .input-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      background: var(--surface2);
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .input-clear.visible { display: flex; }

    /* ── YOUTUBER SELECT ── */
    .youtuber-wrap {
      position: relative;
    }

    .youtuber-select-btn {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 15px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text-dim);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    .youtuber-select-btn.selected { color: var(--text); }
    .youtuber-select-btn:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-glow); outline: none; }

    .youtuber-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--bg3);
      border: 1.5px solid var(--border-red);
      border-radius: var(--radius);
      z-index: 50;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .youtuber-dropdown.open { display: block; }

    .dropdown-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .dropdown-search input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      outline: none;
    }

    .dropdown-list { padding: 4px 0; }

    .dropdown-item {
      padding: 11px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dropdown-item:hover { background: var(--surface); }
    .dropdown-item.direct-input { color: var(--red); }
    .dropdown-item .channel-dot {
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .loading-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

    /* ── VIDEO INFO ── */
    .video-info {
      display: none;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 20px;
      padding: 12px 14px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1.5px solid var(--border-red);
    }
    .video-info.visible { display: flex; }
    .video-info-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }
    .video-info-channel {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .video-info-channel::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .video-info-loading {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── CATEGORY TAGS ── */
    .category-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    /* ── CATEGORY SEARCH ── */
    .cat-search-wrap {
      position: relative;
      margin-bottom: 8px;
    }
    .cat-search-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .cat-search-input::placeholder { color: var(--text-dim); }
    .cat-search-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-glow);
    }
    .cat-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--bg3);
      border: 1.5px solid var(--border-red);
      border-radius: var(--radius);
      z-index: 50;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .cat-dropdown.open { display: block; }
    .cat-dropdown-item {
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .cat-dropdown-item:hover { background: var(--surface); }
    .cat-dropdown-item.add-new { color: var(--red); }
    .cat-dropdown-item .cat-dot {
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .cat-dropdown-item.selected-item { opacity: 0.4; pointer-events: none; }

    .cat-chip {
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 400;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (hover: hover) { .cat-chip:hover { border-color: var(--border-red); color: var(--red); } }
    .cat-chip.active {
      background: rgba(204,0,0,0.08);
      border-color: var(--red);
      color: var(--red);
      font-weight: 500;
    }



    /* selected tags */
    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 12px;
      background: rgba(204,0,0,0.08);
      border: 1.5px solid var(--red);
      border-radius: 20px;
      font-size: 12px;
      color: var(--red);
      font-weight: 500;
    }
    .tag-pill button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      opacity: 0.7;
    }
    .tag-pill button:hover { opacity: 1; }

    /* ── MEMO ── */
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      outline: none;
      resize: none;
      min-height: 80px;
      line-height: 1.6;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    textarea::placeholder { color: var(--text-dim); }
    textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-glow); }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── SAVE BUTTON ── */
    .save-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(245,245,245,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .save-btn {
      width: 100%;
      background: var(--red);
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 20px rgba(204,0,0,0.4);
    }
    @media (hover: hover) { .save-btn:hover { background: var(--red-bright); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(204,0,0,0.5); } }
    .save-btn:active { transform: translateY(0); }
    .save-btn:disabled { background: var(--surface2); color: var(--text-dim); box-shadow: none; cursor: not-allowed; transform: none; }
    .save-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--red); color: #FF6666; }
    .toast svg { width: 16px; height: 16px; fill: currentColor; }

    /* ── SPINNER ── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE ── */
    @media (max-width: 360px) {

    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 34 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="34" height="24" rx="6" fill="#FF0000"/>
          <polygon points="14,7 14,17 23,12" fill="white"/>
        </svg>
      </div>
      <span class="logo-text">Youtube 아카이브</span>
    </div>
    <a href="NOTION_DB_URL" target="_blank" class="header-notion-link" id="notionLink">
      <svg viewBox="0 0 24 24"><path d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952L12.21 19s0 .84-1.168.84l-3.222.186c-.093-.186 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.279v-6.44l-1.215-.139c-.093-.514.28-.887.747-.933zM1.936 1.035l13.31-.98c1.634-.14 2.055-.047 3.082.7l4.249 2.986c.7.513.934.653.934 1.213v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.447-1.632z"/></svg>
      아카이브 보기
    </a>
  </header>

  <!-- MAIN FORM -->
  <main>
    <!-- Thumbnail Preview -->
    <div class="preview-area" id="previewArea">
      <div class="preview-placeholder" id="previewPlaceholder">
        <svg viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg" width="68" height="48">
          <rect x="0" y="0" width="68" height="48" rx="12" fill="#CCCCCC"/>
          <polygon points="28,14 28,34 46,24" fill="white"/>
        </svg>
        <span>유튜브 링크를 입력하면 썸네일이 표시됩니다</span>
      </div>
      <img class="preview-img" id="previewImg" src="" alt="썸네일" />
      <div class="preview-overlay"></div>
      <div class="preview-play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <!-- YouTube URL -->
    <div class="section">
      <div class="section-label">유튜브 링크 *</div>
      <div class="input-wrap">
        <input type="url" id="ytUrl" placeholder="https://youtu.be/..." autocomplete="off" autocorrect="off" autocapitalize="off" />
        <button class="input-clear" id="urlClear" onclick="clearUrl()">✕</button>
      </div>
    </div>

    <!-- Video Info (auto-filled) -->
    <div class="video-info" id="videoInfo">
      <div class="video-info-loading" id="videoInfoLoading" style="display:none">
        <span class="loading-dot"></span><span class="loading-dot" style="animation-delay:0.2s"></span><span class="loading-dot" style="animation-delay:0.4s"></span>
        <span>정보 불러오는 중...</span>
      </div>
      <div class="video-info-title" id="videoInfoTitle"></div>
      <div class="video-info-channel" id="videoInfoChannel"></div>
    </div>

    <!-- Category -->
    <div class="section">
      <div class="section-label">카테고리</div>
      <!-- 최근 사용 5개 칩 -->
      <div class="category-grid" id="catGrid">
        <div style="color:var(--text-dim);font-size:13px;display:flex;align-items:center;gap:6px">
          <span class="loading-dot"></span><span class="loading-dot" style="animation-delay:0.2s"></span><span class="loading-dot" style="animation-delay:0.4s"></span>
          불러오는 중...
        </div>
      </div>
      <!-- 검색/추가 드롭다운 -->
      <div class="cat-search-wrap">
        <input class="cat-search-input" id="catSearch" placeholder="카테고리 검색 또는 직접 추가..."
          autocomplete="off" autocorrect="off"
          oninput="onCatSearch(this.value)"
          onkeydown="onCatSearchKey(event)"
          onfocus="openCatDropdown()"
        />
        <div class="cat-dropdown" id="catDropdown"></div>
      </div>
      <div class="selected-tags" id="selectedTags"></div>
    </div>

    <!-- Memo -->
    <div class="section">
      <div class="section-label">한줄평</div>
      <textarea id="memo" placeholder="간단한 메모를 남겨보세요..." rows="3"></textarea>
    </div>
  </main>

  <!-- SAVE BAR -->
  <div class="save-bar">
    <button class="save-btn" id="saveBtn" onclick="save()">
노션에 저장하기
    </button>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ─── CONFIG ───────────────────────────────────────
    const WORKER_URL    = 'https://youtube-archive.wogns3885.workers.dev';
    const NOTION_DB_URL = 'https://www.notion.so/32f0fe84d333809abce2d12c6c14197f';

    // ─── STATE ────────────────────────────────────────
    let selectedYoutuber = '';
    let autoTitle        = '';
    let selectedCats     = new Set();
    let thumbUrl         = '';
    let allCategories    = [];

    // ─── INIT ─────────────────────────────────────────
    document.getElementById('notionLink').href = NOTION_DB_URL;

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('ytUrl').addEventListener('input', onUrlInput);
      loadCategories();
      document.addEventListener('click', (e) => {
        const wrap = document.querySelector('.cat-search-wrap');
        if (wrap && !wrap.contains(e.target)) closeCatDropdown();
      });
    });

    // ─── URL / THUMBNAIL ──────────────────────────────
    let urlTimer = null;
    function onUrlInput(e) {
      const val = e.target.value.trim();
      document.getElementById('urlClear').classList.toggle('visible', val.length > 0);
      clearTimeout(urlTimer);
      if (!val) { clearThumb(); return; }
      urlTimer = setTimeout(() => loadThumb(val), 600);
    }

    function clearUrl() {
      document.getElementById('ytUrl').value = '';
      document.getElementById('urlClear').classList.remove('visible');
      clearThumb();
    }

    function extractVideoId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/,
        /^([A-Za-z0-9_-]{11})$/
      ];
      for (const p of patterns) {
        const m = url.match(p);
        if (m) return m[1];
      }
      return null;
    }

    function loadThumb(url) {
      const vid = extractVideoId(url);
      if (!vid) { clearThumb(); return; }
      thumbUrl = `https://img.youtube.com/vi/${vid}/maxresdefault.jpg`;
      const img = document.getElementById('previewImg');
      img.onload = () => {
        img.classList.add('visible');
        document.getElementById('previewPlaceholder').style.display = 'none';
        document.getElementById('previewArea').classList.add('has-thumb');
      };
      img.onerror = () => {
        thumbUrl = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
        img.src = thumbUrl;
      };
      img.src = thumbUrl;
      fetchTitle(url);
    }

    async function fetchTitle(url) {
      const infoBox  = document.getElementById('videoInfo');
      const loading  = document.getElementById('videoInfoLoading');
      const titleEl  = document.getElementById('videoInfoTitle');
      const channelEl= document.getElementById('videoInfoChannel');

      infoBox.classList.add('visible');
      loading.style.display = 'flex';
      titleEl.textContent   = '';
      channelEl.textContent = '';
      autoTitle        = '';
      selectedYoutuber = '';

      try {
        const res  = await fetch(`${WORKER_URL}/title?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        autoTitle        = data.title       || '';
        selectedYoutuber = data.author_name || '';
        titleEl.textContent   = autoTitle;
        channelEl.textContent = selectedYoutuber;
      } catch {
        titleEl.textContent = '정보를 불러올 수 없습니다';
      } finally {
        loading.style.display = 'none';
      }
    }

    function clearThumb() {
      thumbUrl = ''; autoTitle = ''; selectedYoutuber = '';
      const img = document.getElementById('previewImg');
      img.classList.remove('visible');
      img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
      document.getElementById('previewPlaceholder').style.display = '';
      document.getElementById('previewArea').classList.remove('has-thumb');
      const infoBox = document.getElementById('videoInfo');
      infoBox.classList.remove('visible');
      document.getElementById('videoInfoTitle').textContent   = '';
      document.getElementById('videoInfoChannel').textContent = '';
    }

    // ─── CATEGORY ─────────────────────────────────────
    function getRecentCats() {
      try { return JSON.parse(localStorage.getItem('recentCats') || '[]'); }
      catch { return []; }
    }
    function saveRecentCats(cats) {
      localStorage.setItem('recentCats', JSON.stringify(cats));
    }
    function addToRecentCats(cat) {
      let recent = getRecentCats().filter(c => c !== cat);
      recent.unshift(cat);
      saveRecentCats(recent.slice(0, 10));
    }

    async function loadCategories() {
      try {
        const res  = await fetch(`${WORKER_URL}/categories`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        allCategories = data.categories || [];
        renderCategoryChips();
      } catch {
        document.getElementById('catGrid').innerHTML =
          '<div style="color:var(--text-dim);font-size:13px">카테고리 불러오기 실패</div>';
      }
    }

    function renderCategoryChips() {
      const grid = document.getElementById('catGrid');
      if (allCategories.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-dim);font-size:13px">카테고리를 검색해서 추가하세요</div>';
        return;
      }
      const recent  = getRecentCats().filter(c => allCategories.includes(c)).slice(0, 5);
      const toShow  = recent.length > 0 ? recent : allCategories.slice(0, 5);
      grid.innerHTML = toShow.map(cat =>
        `<button class="cat-chip${selectedCats.has(cat) ? ' active' : ''}" data-cat="${cat}" onclick="toggleCat(this)">${cat}</button>`
      ).join('');
    }

    function toggleCat(el) {
      const cat = el.dataset.cat;
      if (selectedCats.has(cat)) {
        selectedCats.delete(cat);
        el.classList.remove('active');
      } else {
        selectedCats.add(cat);
        el.classList.add('active');
      }
      renderSelectedTags(); // chip에 없는 선택항목만 pill로 표시
    }

    // ─── CATEGORY SEARCH DROPDOWN ─────────────────────
    function onCatSearch(q) {
      openCatDropdown();
      renderCatDropdown(q);
    }

    function onCatSearchKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = document.getElementById('catSearch').value.trim();
        if (!q) return;
        const first = document.querySelector('.cat-dropdown-item:not(.selected-item)');
        if (first) first.click();
      }
      if (e.key === 'Escape') closeCatDropdown();
    }

    function openCatDropdown() {
      renderCatDropdown(document.getElementById('catSearch').value);
      document.getElementById('catDropdown').classList.add('open');
    }

    function closeCatDropdown() {
      document.getElementById('catDropdown').classList.remove('open');
      document.getElementById('catSearch').value = '';
    }

    function renderCatDropdown(q) {
      const dd       = document.getElementById('catDropdown');
      const filtered = q
        ? allCategories.filter(c => c.toLowerCase().includes(q.toLowerCase()))
        : allCategories;

      let html = '';
      filtered.forEach(cat => {
        const isSel = selectedCats.has(cat) ? ' selected-item' : '';
        html += `<div class="cat-dropdown-item${isSel}" onclick="selectCatFromDropdown('${cat.replace(/'/g,"\'")}')">
          <span class="cat-dot"></span>${cat}${isSel ? ' ✓' : ''}
        </div>`;
      });

      if (q && !allCategories.includes(q)) {
        html += `<div class="cat-dropdown-item add-new" onclick="selectCatFromDropdown('${q.replace(/'/g,"\'")}')">
          + "${q}" 추가
        </div>`;
      }

      if (!html) {
        html = '<div style="padding:10px 14px;font-size:13px;color:var(--text-dim)">검색 결과 없음</div>';
      }
      dd.innerHTML = html;
    }

    function selectCatFromDropdown(cat) {
      if (!selectedCats.has(cat)) {
        selectedCats.add(cat);
        addToRecentCats(cat);
        renderCategoryChips();
        renderSelectedTags();
      }
      closeCatDropdown();
    }

    function removeTag(cat) {
      selectedCats.delete(cat);
      // 칩에 있는 항목이면 칩 active 해제
      document.querySelectorAll('.cat-chip').forEach(b => {
        if (b.dataset.cat === cat) b.classList.remove('active');
      });
      renderSelectedTags();
    }

    // 현재 보이는 칩 목록 가져오기
    function getChipCats() {
      return [...document.querySelectorAll('.cat-chip')].map(b => b.dataset.cat);
    }

    function renderSelectedTags() {
      const wrap = document.getElementById('selectedTags');
      const chipCats = getChipCats();
      wrap.innerHTML = '';
      // 칩에 없는 선택 항목만 pill로 표시
      selectedCats.forEach(cat => {
        if (chipCats.includes(cat)) return; // 칩에 있으면 pill 생략
        const pill = document.createElement('div');
        pill.className = 'tag-pill';
        pill.innerHTML = `${cat}<button onclick="removeTag('${cat.replace(/'/g,"\'")}')">✕</button>`;
        wrap.appendChild(pill);
      });
    }

    // ─── SAVE ─────────────────────────────────────────
    async function save() {
      const url  = document.getElementById('ytUrl').value.trim();
      const memo = document.getElementById('memo').value.trim();

      if (!url)       { showToast('유튜브 링크를 입력해주세요', 'error'); return; }
      if (!autoTitle) { showToast('영상 정보를 불러오는 중입니다', 'error'); return; }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> 저장 중...';

      const payload = {
        title:      autoTitle,
        url,
        youtuber:   selectedYoutuber,
        categories: [...selectedCats],
        memo,
        thumbnail:  thumbUrl
      };

      try {
        const res = await fetch(`${WORKER_URL}/save`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(await res.text());

        [...selectedCats].forEach(c => addToRecentCats(c));
        showToast('저장 완료! Notion에 추가되었습니다 ✓', 'success');
        resetForm();
      } catch (err) {
        console.error(err);
        showToast('저장 실패: ' + (err.message || '서버 오류'), 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '노션에 저장하기';
      }
    }

    function resetForm() {
      document.getElementById('ytUrl').value  = '';
      document.getElementById('memo').value   = '';
      document.getElementById('urlClear').classList.remove('visible');
      clearThumb();
      selectedCats.clear();
      document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
      document.getElementById('selectedTags').innerHTML = '';
      closeCatDropdown();
    }

    // ─── TOAST ────────────────────────────────────────
    let toastTimer;
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      clearTimeout(toastTimer);
      const icon = type === 'success'
        ? '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>'
        : type === 'error'
        ? '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>'
        : '';
      t.innerHTML = icon + msg;
      t.className = `toast ${type}`;
      requestAnimationFrame(() => { requestAnimationFrame(() => t.classList.add('show')); });
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ─── PWA SERVICE WORKER ───────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
